services:
  mongo:
    image: mongo:7
    container_name: posto_saude_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: posto_saude_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/posto_saude
      - MONGO_DB_NAME=posto_saude
      - FLASK_DEBUG=true
    depends_on:
      - mongo
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: posto_saude_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
